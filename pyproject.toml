[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipython-applibs"
dynamic = ["version"]
description = "The libraries apps share, in one package"
readme = "README.md"
authors = [{ name = "Brad Barnett" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Programming Language :: Python :: Implementation :: CPython",
]
keywords = ["lvgl", "controls", "apps", "micropython"]
# Most of the libraries draw with LVGL, and appkit also needs omnipython-desktop
# (multimer, appdev, and icons from 0.8.1.dev4). Both are large and a board has
# them in its firmware, so they come with the `apps` extra, not by default.
dependencies = []

[project.optional-dependencies]
apps = ["omnipython-desktop>=0.8.1.dev5", "omnipython-lvgl"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["lib"]
exclude = ["*.examples", "*.examples.*", "*.tests", "*.tests.*", "*.docs", "*.docs.*"]

[tool.setuptools.package-data]
songmodel = ["page.html"]
