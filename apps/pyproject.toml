# Generated by tools/app_packages.py from the apps folder; edit the apps, not this.
#
# pip install "omnipython-apps @ git+https://github.com/PyDevices/apps#subdirectory=apps"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipython-apps"
# The apps install from the main branch, so the version never changes.
version = "0"
description = "Every app for Home, from the main branch"
authors = [{ name = "Brad Barnett" }]
license = { text = "MIT" }
# Everything the apps need, as on a board: tools/app_packages.py's PIP table.
dependencies = [
    "numpy",
    "omnipython-audioeffects",
    "omnipython-audioinstruments",
    "omnipython-desktop>=0.8.1.dev9",
    "omnipython-palettes",
    "omnipython-pygraphics",
    "omnipython>=0.8.1.dev10",
    "requests",
    "scipy",
    "omnipython-applibs[apps] @ git+https://github.com/PyDevices/apps",
]

[tool.setuptools]
package-dir = { "apps" = "." }
packages = [
    "apps",
    "apps.backline",
    "apps.backline.desk",
    "apps.battery",
    "apps.bit_world",
    "apps.btreceiver",
    "apps.camera",
    "apps.card",
    "apps.cast",
    "apps.clock",
    "apps.detect",
    "apps.gamepad",
    "apps.hidden",
    "apps.home",
    "apps.huey",
    "apps.info",
    "apps.lora",
    "apps.medialink_baby_monitor",
    "apps.medialink_doorbell",
    "apps.medialink_hands_free",
    "apps.medialink_surveillance_camera",
    "apps.medialink_video_doorbell",
    "apps.medialink_videophone",
    "apps.medialink_walkie_talkie",
    "apps.midicontroller",
    "apps.midiengine",
    "apps.mp3",
    "apps.perch",
    "apps.repl",
    "apps.roku",
    "apps.security",
    "apps.settings",
    "apps.shell",
    "apps.spotify",
    "apps.steps",
    "apps.stompbox",
    "apps.synthstation",
    "apps.system",
    "apps.touchcal",
    "apps.wake",
    "apps.watch",
    "apps.weather",
]

[tool.setuptools.package-data]
"apps.backline" = ["app.json", "songs/ballad_68.json", "songs/bossa.json", "songs/country_train.json", "songs/funk.json", "songs/metal.json", "songs/pop.json", "songs/rock.json", "songs/shuffle.json"]
