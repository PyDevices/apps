name: Tests

# Documentation-only changes can't change these results, so they don't run them.
# Past that, the scope job reads the diff and each job runs only for the paths it
# checks: ostinato for programs/ostinato and lib/ (its page loads studio's lib/), and
# engines for lib/, tests/ and this workflow (which holds its pins). A push to
# main is scoped to what that push changed. A manual run, or a push with no
# earlier commit to compare with, runs both.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/LICENSE'
  workflow_dispatch:

# A newer commit on a pull request replaces the run for the older one. Pushes to
# main are never cancelled: each is checked only for its own changes.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # What Vamp and the sound module are checked against, each a commit so a
  # change upstream can't redden this repository with nothing here moved.
  # audioeffects names its own audiodsp in AUDIODSP_PIN, and audioinstruments
  # needs one that new (audiodsp 0.6.11 or later), so the pin stands for both.
  # Both are the v0.5.0 tags.
  AUDIOINSTRUMENTS_REF: 256662f69dc18d9bcd59f395b95a562ae74504f9
  AUDIOEFFECTS_REF: c0b05edc79e54b3d944417d983030676b80cfca3
  # The catalogs the sound module's DAW names are built from aren't in a
  # release of either package yet.
  AUDIOINSTRUMENTS_CATALOG_REF: a6d394852f3957fc188cea9ba03e23c771677587
  AUDIOEFFECTS_CATALOG_REF: 3a39612f4fc0057c7742e82f636188b6af47ce69
  # The instrument panel isn't in an audioinstruments release yet.
  AUDIOINSTRUMENTS_PANEL_REF: a32dc9891f9e2d8f12692e73fe835cdc6d54e069
  # hmilink isn't in an omnipython release yet.
  OMNIPYTHON_REF: 6b7937357865c4fbd320c889cc79473f0942fc83
  MICROPYTHON_REF: v1.29.0

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ostinato: ${{ steps.scope.outputs.ostinato }}
      engines: ${{ steps.scope.outputs.engines }}
      synthstation: ${{ steps.scope.outputs.synthstation }}
      appkit: ${{ steps.scope.outputs.appkit }}
      bit_world: ${{ steps.scope.outputs.bit_world }}
      camera: ${{ steps.scope.outputs.camera }}
      app_packages: ${{ steps.scope.outputs.app_packages }}
      gamepad: ${{ steps.scope.outputs.gamepad }}
      perch: ${{ steps.scope.outputs.perch }}
      btreceiver: ${{ steps.scope.outputs.btreceiver }}
      huey: ${{ steps.scope.outputs.huey }}
      midicontroller: ${{ steps.scope.outputs.midicontroller }}
      backline: ${{ steps.scope.outputs.backline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Which jobs this change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "${BASE//0/}" ] \
              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Both jobs: a manual run, or no earlier commit to compare with."
            echo "ostinato=true" >> "$GITHUB_OUTPUT"
            echo "engines=true" >> "$GITHUB_OUTPUT"
            echo "synthstation=true" >> "$GITHUB_OUTPUT"
            echo "appkit=true" >> "$GITHUB_OUTPUT"
            echo "bit_world=true" >> "$GITHUB_OUTPUT"
            echo "camera=true" >> "$GITHUB_OUTPUT"
            echo "app_packages=true" >> "$GITHUB_OUTPUT"
            echo "gamepad=true" >> "$GITHUB_OUTPUT"
            echo "perch=true" >> "$GITHUB_OUTPUT"
            echo "btreceiver=true" >> "$GITHUB_OUTPUT"
            echo "huey=true" >> "$GITHUB_OUTPUT"
            echo "midicontroller=true" >> "$GITHUB_OUTPUT"
            echo "backline=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$GITHUB_SHA")
          echo "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          echo "ostinato=$(has '^(programs/ostinato/|lib/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "engines=$(has '^(lib/|tests/|apps/stompbox/|apps/backline/|programs/vamp/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "synthstation=$(has '^(apps/synthstation/|lib/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "appkit=$(has '^(lib/appkit/|tests/appkit/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "bit_world=$(has '^(apps/bit_world/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "camera=$(has '^(programs/camera/|tests/test_camera\.py$|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "app_packages=$(has '^(apps/|lib/|programs/|tools/app_packages\.py$|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "gamepad=$(has '^(apps/gamepad/|lib/(touchkit|appkit)/|tests/(test_gamepad|gamepad_contract|_headless)\.py$|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "perch=$(has '^(apps/perch/|tests/(test_perch|perch_contract|perch_drawings|_headless)\.py$|tests/perch_drawings\.golden$|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "btreceiver=$(has '^(apps/btreceiver/|lib/(touchkit|appkit|controlkit|spectrum)/|tests/(test_btreceiver|btreceiver_contract|_headless)\.py$|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "huey=$(has '^(apps/(huey|perch)/|lib/chatclient/|tests/(test_huey|huey_contract|huey_fakes|huey_servers_check|_headless)\.py$|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "midicontroller=$(has '^(apps/midicontroller/|lib/(touchkit|appkit|controlkit)/|tests/(test_midicontroller|midicontroller_contract|_headless)\.py$|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "backline=$(has '^(apps/backline/|lib/songmodel/|tools/backline/|tests/(test_backline|backline_contract|backline_floor_contract|backline_desk_contract|backline_cast_contract|_headless|test_engine|test_backline_web)\.py$|tests/backline_web/|programs/backline-web/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Ostinato's own checks: the page, the service worker and what each
  # worker loads. A few seconds once PyScript is vendored.
  ostinato:
    needs: scope
    if: needs.scope.outputs.ostinato == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # iconkit, which draws Ostinato's icons, lives in the omnipython repo.
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          path: omnipython

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Vendor PyScript
        working-directory: programs/ostinato
        run: ./scripts/vendor_pyscript.sh

      - name: Ostinato's tests
        working-directory: programs/ostinato
        env:
          ICONKIT_LIB: ${{ github.workspace }}/omnipython/packages/iconkit/lib
        run: python -m unittest discover -s tests -v

  # Synth Station's tests on CPython, against controlkit from lib/,
  # audioinstruments from its main branch and omnipython from its main branch,
  # on a display with no window. Its MicroPython half needs a unix build with
  # LVGL and audiodsp, so it skips here, loudly.
  synthstation:
    needs: scope
    if: needs.scope.outputs.synthstation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: studio

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          path: audioinstruments

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          path: omnipython

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL and audiodsp for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" "omnipython-audiodsp>=0.6.13.dev4" numpy

      - name: Synth Station's tests
        working-directory: studio/apps/synthstation
        env:
          OMNIPYTHON_DIR: ${{ github.workspace }}/omnipython
          SYNTHSTATION_PATH: ${{ github.workspace }}/audioinstruments/lib:${{ github.workspace }}/studio/lib
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  # appkit's tests on CPython, against omnipython from its main branch (appdev,
  # events and multimer come from there). Its MicroPython half needs a unix
  # build with LVGL, so it skips here, loudly.
  appkit:
    needs: scope
    if: needs.scope.outputs.appkit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: studio

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          path: omnipython

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # icons draws with ttfio: on CPython, omnipython's utils/ttfio.py over
      # freetype-py, put on the path alone.
      - name: Install LVGL and FreeType for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" freetype-py
          mkdir -p "$RUNNER_TEMP/ttfio" && cp omnipython/utils/ttfio.py "$RUNNER_TEMP/ttfio/"

      - name: appkit's tests
        working-directory: studio
        env:
          OMNIPYTHON_LIB: ${{ github.workspace }}/omnipython/lib
          PYTHONPATH: ${{ runner.temp }}/ttfio
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests/appkit -p 'test_*.py' -v

  # Each app's package.json matches its folder and its imports, so
  # omip.install("github:PyDevices/apps/apps/<name>") installs what it needs;
  # the same for a program that holds one app, as programs/camera does.
  app_packages:
    needs: scope
    if: needs.scope.outputs.app_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The apps' package.json files are up to date
        run: python tools/app_packages.py --check

  # Huey's Perch on CPython, on a display with no window, with svgio's
  # desktop stand-in. Its MicroPython half needs a unix build with LVGL and
  # svgio, so it skips here, loudly.
  perch:
    needs: scope
    if: needs.scope.outputs.perch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL, svgio and icons for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" "omnipython-desktop>=0.8.1.dev4" "omnipython>=0.8.0.dev21" resvg_py pillow

      - name: Perch's tests
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m unittest tests.test_perch -v

  # Backline on CPython: the engine, pedal, songs, kits and panel, every
  # planted fault, and the floor view on a display with no window. Its
  # MicroPython half runs in the engines job, which builds the interpreter.
  backline:
    needs: scope
    if: needs.scope.outputs.backline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          ref: ${{ env.AUDIOINSTRUMENTS_REF }}
          path: audioinstruments

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          ref: ${{ env.OMNIPYTHON_REF }}
          path: omnipython
          sparse-checkout: packages/hmilink

      # Backline draws icons newer than the omnipython-desktop on PyPI: the
      # icons package from source, at the commit that added them, over it.
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          ref: e21d9298a1805bc5fbc7b2a91bbe76b914bf7ca0
          path: omnipython-icons
          sparse-checkout: packages/icons

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL, svgio, icons and audiodsp for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" "omnipython-desktop>=0.8.1.dev4" "omnipython>=0.8.0.dev21" omnipython-audiodsp numpy resvg_py pillow

      - name: Backline's tests
        env:
          SDL_VIDEODRIVER: dummy
          AUDIOINSTRUMENTS_DIR: ${{ github.workspace }}/audioinstruments
          HMILINK_PATH: ${{ github.workspace }}/omnipython/packages/hmilink
          PYTHONPATH: ${{ github.workspace }}/omnipython-icons/packages/icons
          BACKLINE_REQUIRE: "1"
        # The web page's browser checks skip here, loudly: they need
        # MicroPython's WebAssembly build and Playwright's Chromium.
        run: python -m unittest tests.test_backline tests.test_backline_web -v

  # Bluetooth Receiver on CPython, on a display with no window, against its
  # demo phone. Its MicroPython half needs a unix build with LVGL, svgio and
  # jpegio, so it skips here, loudly.
  btreceiver:
    needs: scope
    if: needs.scope.outputs.btreceiver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL, svgio, jpegio and pygraphics for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" "omnipython-desktop>=0.8.1.dev4" "omnipython>=0.8.0.dev21" "omnipython-pygraphics>=0.1.7.dev0" resvg_py pillow

      - name: Bluetooth Receiver's tests
        env:
          SDL_VIDEODRIVER: dummy
          BTRECEIVER_REQUIRE: "1"
        run: python -m unittest tests.test_btreceiver.CPythonReceiver -v

  # Huey on CPython, on a display with no window: a whole turn of a
  # conversation against a stand-in server, microphone and speaker, and the
  # app's client against an HTTP server on the runner. Its MicroPython half
  # needs a unix build with LVGL and svgio, so it skips here, loudly.
  huey:
    needs: scope
    if: needs.scope.outputs.huey == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL, svgio and omnipython for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" "omnipython-desktop>=0.8.1.dev4" "omnipython>=0.8.0.dev21" resvg_py pillow

      - name: Huey's tests
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m unittest tests.test_huey -v

  # The Gamepad app on CPython against omnipython's usb-hid and usb-host-hid from
  # its main branch, on a display with no window: a press on the gamepad's
  # screen is read back by the tester's.
  gamepad:
    needs: scope
    if: needs.scope.outputs.gamepad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: studio

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          path: omnipython
          # icons draws with ttfio: on CPython, utils/ttfio.py over freetype-py.
          sparse-checkout: |
            /lib/
            /packages/usb/
            /packages/icons/
            /packages/_boardname/
            /utils/ttfio.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL and FreeType for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" freetype-py

      - name: The Gamepad app's tests
        working-directory: studio
        env:
          OMNIPYTHON_DIR: ${{ github.workspace }}/omnipython
          PYTHONPATH: ${{ github.workspace }}/omnipython/utils
          GAMEPAD_REQUIRE: "1"
          SDL_VIDEODRIVER: dummy
        run: python -m unittest tests.test_gamepad -v

  # The MIDI Controller app on CPython against omnipython's midiports from its
  # main branch, on a display with no window: each touch is read back as the
  # bytes on the USB wire, and what comes in moves the controls.
  midicontroller:
    needs: scope
    if: needs.scope.outputs.midicontroller == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: studio

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          path: omnipython
          # icons draws with ttfio: on CPython, utils/ttfio.py over freetype-py.
          sparse-checkout: |
            /lib/
            /packages/midiports/
            /packages/icons/
            /packages/_boardname/
            /utils/ttfio.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL and FreeType for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" freetype-py

      - name: The MIDI Controller app's tests
        working-directory: studio
        env:
          OMNIPYTHON_DIR: ${{ github.workspace }}/omnipython
          PYTHONPATH: ${{ github.workspace }}/omnipython/utils
          MIDICONTROLLER_REQUIRE: "1"
          SDL_VIDEODRIVER: dummy
        run: python -m unittest tests.test_midicontroller -v

  # Bit World's tests on CPython, against the released omnipython, pygraphics
  # and audiodsp, on a display with no window: the partial repaint matches a
  # full redraw, and the exit button quits and closes the audio.
  bit_world:
    needs: scope
    if: needs.scope.outputs.bit_world == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install omnipython, pygraphics and audiodsp for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-desktop>=0.8.0.dev22" "omnipython-pygraphics>=0.1.7.dev0" "omnipython-palettes>=0.0.16.dev0" "omnipython-audiodsp>=0.6.16.dev6" "omnipython>=0.8.0.dev22"

      - name: Bit World's tests
        working-directory: apps/bit_world
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v

  # The camera program's layout, controls, picture sources and crop, which
  # need nothing past the standard library.
  camera:
    needs: scope
    if: needs.scope.outputs.camera == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The camera program's tests
        run: python -m unittest tests.test_camera -v

  # Vamp's engine check and link contract, the sound module's contract and
  # Stompbox's meter check, on CPython and unix MicroPython, each with its
  # planted faults. The whole job takes under three minutes, half of it the
  # MicroPython build.
  engines:
    needs: scope
    if: needs.scope.outputs.engines == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: studio

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          ref: ${{ env.AUDIOINSTRUMENTS_REF }}
          path: audioinstruments

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          ref: ${{ env.AUDIOINSTRUMENTS_PANEL_REF }}
          path: audioinstruments-panel

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioeffects
          ref: ${{ env.AUDIOEFFECTS_REF }}
          path: audioeffects

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          ref: ${{ env.AUDIOINSTRUMENTS_CATALOG_REF }}
          path: catalogs/audioinstruments
          sparse-checkout: lib/audioinstruments/catalog.json
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioeffects
          ref: ${{ env.AUDIOEFFECTS_CATALOG_REF }}
          path: catalogs/audioeffects
          sparse-checkout: lib/audioeffects/catalog.json
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          ref: ${{ env.OMNIPYTHON_REF }}
          path: omnipython

      # appkit draws its icons with icons (and icons with ttfio, on CPython
      # utils/ttfio.py over freetype-py), and the REPL app's test pages
      # through vtterm's scrollback, all newer than the pin above.
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/omnipython
          path: omnipython-main
          sparse-checkout: |
            /packages/icons/
            /packages/vtterm/
            /packages/palettes/lib/
            /lib/
            /utils/ttfio.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The controlkit tests import lvgl on CPython.
      # freetype-py: ttfio draws the status bar's icons with it on CPython.
      - name: Install LVGL for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install "omnipython-lvgl>=9.6.1.dev1" "omnipython-pygraphics>=0.1.7.dev0" freetype-py

      - name: Resolve audioeffects' audiodsp pin
        id: pin
        run: |
          tag=$(grep -v '^[[:space:]]*#' audioeffects/AUDIODSP_PIN | grep -v '^[[:space:]]*$' \
                | head -1 | awk '{print $1}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "audiodsp pinned at $tag"

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audiodsp
          ref: ${{ steps.pin.outputs.tag }}
          path: modules/audiodsp

      - name: Install audiodsp on CPython
        run: |
          python -m pip install ./modules/audiodsp numpy

      # The rack computes with ulab on MicroPython.
      - uses: actions/checkout@v7
        with:
          repository: v923z/micropython-ulab
          ref: 6.7.3
          path: ulab-src

      - uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: ${{ env.MICROPYTHON_REF }}
          path: micropython

      # USER_C_MODULES is the parent folder: py.mk takes every
      # */micropython.mk one level down, which is audiodsp and ulab.
      - name: Build unix MicroPython with audiodsp and ulab
        run: |
          ln -s $GITHUB_WORKSPACE/ulab-src/code modules/ulab
          (cd modules/audiodsp && ./scripts/fetch_deps.sh)
          make -C micropython/mpy-cross -j4
          make -C micropython/ports/unix submodules
          make -C micropython/ports/unix -j4 USER_C_MODULES=$GITHUB_WORKSPACE/modules

      - name: The apps repo's tests
        working-directory: studio
        env:
          OMNIPYTHON_MICROPYTHON: ${{ github.workspace }}/micropython/ports/unix/build-standard/micropython
          AUDIOINSTRUMENTS_DIR: ${{ github.workspace }}/audioinstruments
          AUDIOINSTRUMENTS_PANEL_DIR: ${{ github.workspace }}/audioinstruments-panel
          PANEL_REQUIRE: "1"
          AUDIOEFFECTS_DIR: ${{ github.workspace }}/audioeffects
          AUDIOINSTRUMENTS_CATALOG: ${{ github.workspace }}/catalogs/audioinstruments/lib/audioinstruments/catalog.json
          AUDIOEFFECTS_CATALOG: ${{ github.workspace }}/catalogs/audioeffects/lib/audioeffects/catalog.json
          HMILINK_PATH: ${{ github.workspace }}/omnipython/packages/hmilink
          VAMP_REQUIRE: "1"
          VTTERM_PATH: ${{ github.workspace }}/omnipython-main/packages
          REPL_REQUIRE: "1"
          PYTHONPATH: ${{ github.workspace }}/omnipython-main/packages/icons:${{ github.workspace }}/omnipython-main/utils
        run: python -m unittest discover -s tests -v
