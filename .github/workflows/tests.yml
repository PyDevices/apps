name: Tests

# Documentation-only changes can't change these results, so they don't run them.
# Past that, the scope job reads the diff and each job runs only for the paths it
# checks: ostinato for programs/ostinato and lib/ (its page loads studio's lib/), and
# engines for lib/, tests/ and this workflow (which holds its pins). A push to
# main is scoped to what that push changed. A manual run, or a push with no
# earlier commit to compare with, runs both.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/LICENSE'
  workflow_dispatch:

# A newer commit on a pull request replaces the run for the older one. Pushes to
# main are never cancelled: each is checked only for its own changes.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # What Vamp and the sound module are checked against, each a commit so a
  # change upstream can't redden this repository with nothing here moved.
  # audioeffects names its own audiodsp in AUDIODSP_PIN, and audioinstruments
  # needs one that new (audiodsp 0.6.11 or later), so the pin stands for both.
  # Both are the v0.5.0 tags.
  AUDIOINSTRUMENTS_REF: 256662f69dc18d9bcd59f395b95a562ae74504f9
  AUDIOEFFECTS_REF: c0b05edc79e54b3d944417d983030676b80cfca3
  # The catalogs the sound module's DAW names are built from aren't in a
  # release of either package yet.
  AUDIOINSTRUMENTS_CATALOG_REF: a6d394852f3957fc188cea9ba03e23c771677587
  AUDIOEFFECTS_CATALOG_REF: 3a39612f4fc0057c7742e82f636188b6af47ce69
  # The instrument panel isn't in an audioinstruments release yet.
  AUDIOINSTRUMENTS_PANEL_REF: a32dc9891f9e2d8f12692e73fe835cdc6d54e069
  # hmilink isn't in a pydevices release yet.
  PYDEVICES_REF: aa6911844168c21296a8f72dc825d744bf2a6c1f
  MICROPYTHON_REF: v1.29.0

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ostinato: ${{ steps.scope.outputs.ostinato }}
      engines: ${{ steps.scope.outputs.engines }}
      synthstation: ${{ steps.scope.outputs.synthstation }}
      appkit: ${{ steps.scope.outputs.appkit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Which jobs this change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "${BASE//0/}" ] \
              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Both jobs: a manual run, or no earlier commit to compare with."
            echo "ostinato=true" >> "$GITHUB_OUTPUT"
            echo "engines=true" >> "$GITHUB_OUTPUT"
            echo "synthstation=true" >> "$GITHUB_OUTPUT"
            echo "appkit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$GITHUB_SHA")
          echo "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          echo "ostinato=$(has '^(programs/ostinato/|lib/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "engines=$(has '^(lib/|tests/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "synthstation=$(has '^(apps/synthstation/|lib/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "appkit=$(has '^(lib/appkit/|tests/appkit/|\.github/workflows/tests\.yml$)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Ostinato's own checks: the page, the service worker and what each
  # worker loads. A few seconds once PyScript is vendored.
  ostinato:
    needs: scope
    if: needs.scope.outputs.ostinato == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Vendor PyScript
        working-directory: programs/ostinato
        run: ./scripts/vendor_pyscript.sh

      - name: Ostinato's tests
        working-directory: programs/ostinato
        run: python -m unittest discover -s tests -v

  # Synth Station's tests on CPython, against controlkit from lib/,
  # audioinstruments from its main branch and pydevices from its main branch,
  # on a display with no window. Its MicroPython half needs a unix build with
  # LVGL and audiodsp, so it skips here, loudly.
  synthstation:
    needs: scope
    if: needs.scope.outputs.synthstation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: studio

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          path: audioinstruments

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/pydevices
          path: pydevices

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL and audiodsp for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pydevices-lvgl "omnipython-audiodsp>=0.6.13.dev4" numpy

      - name: Synth Station's tests
        working-directory: studio/apps/synthstation
        env:
          PYDEVICES_DIR: ${{ github.workspace }}/pydevices
          SYNTHSTATION_PATH: ${{ github.workspace }}/audioinstruments/lib:${{ github.workspace }}/studio/lib
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  # appkit's tests on CPython, against pydevices from its main branch (appdev,
  # events and multimer come from there). Its MicroPython half needs a unix
  # build with LVGL, so it skips here, loudly.
  appkit:
    needs: scope
    if: needs.scope.outputs.appkit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: studio

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/pydevices
          path: pydevices

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LVGL for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pydevices-lvgl

      - name: appkit's tests
        working-directory: studio
        env:
          PYDEVICES_LIB: ${{ github.workspace }}/pydevices/lib
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests/appkit -p 'test_*.py' -v

  # Vamp's engine check and link contract, and the sound module's contract,
  # on CPython and unix MicroPython, each with its planted faults. The
  # whole job takes under three minutes, half of it the MicroPython build.
  engines:
    needs: scope
    if: needs.scope.outputs.engines == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: studio

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          ref: ${{ env.AUDIOINSTRUMENTS_REF }}
          path: audioinstruments

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          ref: ${{ env.AUDIOINSTRUMENTS_PANEL_REF }}
          path: audioinstruments-panel

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioeffects
          ref: ${{ env.AUDIOEFFECTS_REF }}
          path: audioeffects

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioinstruments
          ref: ${{ env.AUDIOINSTRUMENTS_CATALOG_REF }}
          path: catalogs/audioinstruments
          sparse-checkout: lib/audioinstruments/catalog.json
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audioeffects
          ref: ${{ env.AUDIOEFFECTS_CATALOG_REF }}
          path: catalogs/audioeffects
          sparse-checkout: lib/audioeffects/catalog.json
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/pydevices
          ref: ${{ env.PYDEVICES_REF }}
          path: pydevices

      # appkit draws its icons from iconkit, which is newer than the pin above.
      - uses: actions/checkout@v7
        with:
          repository: PyDevices/pydevices
          path: iconkit-src
          sparse-checkout: packages/iconkit/lib

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The controlkit tests import lvgl on CPython.
      - name: Install LVGL for CPython
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0
          python -m pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pydevices-lvgl

      - name: Resolve audioeffects' audiodsp pin
        id: pin
        run: |
          tag=$(grep -v '^[[:space:]]*#' audioeffects/AUDIODSP_PIN | grep -v '^[[:space:]]*$' \
                | head -1 | awk '{print $1}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "audiodsp pinned at $tag"

      - uses: actions/checkout@v7
        with:
          repository: PyDevices/audiodsp
          ref: ${{ steps.pin.outputs.tag }}
          path: modules/audiodsp

      - name: Install audiodsp on CPython
        run: |
          python -m pip install ./modules/audiodsp numpy

      # The rack computes with ulab on MicroPython.
      - uses: actions/checkout@v7
        with:
          repository: v923z/micropython-ulab
          ref: 6.7.3
          path: ulab-src

      - uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: ${{ env.MICROPYTHON_REF }}
          path: micropython

      # USER_C_MODULES is the parent folder: py.mk takes every
      # */micropython.mk one level down, which is audiodsp and ulab.
      - name: Build unix MicroPython with audiodsp and ulab
        run: |
          ln -s $GITHUB_WORKSPACE/ulab-src/code modules/ulab
          (cd modules/audiodsp && ./scripts/fetch_deps.sh)
          make -C micropython/mpy-cross -j4
          make -C micropython/ports/unix submodules
          make -C micropython/ports/unix -j4 USER_C_MODULES=$GITHUB_WORKSPACE/modules

      - name: The apps repo's tests
        working-directory: studio
        env:
          PYDEVICES_MICROPYTHON: ${{ github.workspace }}/micropython/ports/unix/build-standard/micropython
          AUDIOINSTRUMENTS_DIR: ${{ github.workspace }}/audioinstruments
          AUDIOINSTRUMENTS_PANEL_DIR: ${{ github.workspace }}/audioinstruments-panel
          PANEL_REQUIRE: "1"
          AUDIOEFFECTS_DIR: ${{ github.workspace }}/audioeffects
          AUDIOINSTRUMENTS_CATALOG: ${{ github.workspace }}/catalogs/audioinstruments/lib/audioinstruments/catalog.json
          AUDIOEFFECTS_CATALOG: ${{ github.workspace }}/catalogs/audioeffects/lib/audioeffects/catalog.json
          HMILINK_PATH: ${{ github.workspace }}/pydevices/hmilink
          VAMP_REQUIRE: "1"
          PYTHONPATH: ${{ github.workspace }}/iconkit-src/packages/iconkit/lib
        run: python -m unittest discover -s tests -v
