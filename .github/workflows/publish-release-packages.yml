name: Publish release packages

# A published GitHub Release (made by tag-release.yml when VERSION changes on
# main) builds omnipython-applibs, uploads it to PyPI, asks the library index
# to publish lib/'s packages from the tag, and asks omnipython-builds to build
# the all-apps page from the tag and publish it to apps.omnipython.org.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v31
    with:
      build-kind: pure-python
      distribution-name: omnipython-applibs
      # The one with no dependencies: controlkit needs lvgl and appkit needs omnipython.
      import-name: songmodel
      mip-profile: applibs
      # Every version goes to PyPI; the pypi job below uploads.
      pypi-publish: true
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit

  pypi:
    # The upload runs in this file because PyPI matches its Trusted Publisher
    # against the workflow that runs the upload job. Every version goes, pre-releases
    # included; the pypi environment allows v* tags only.
    needs: publish
    if: >-
      !cancelled() && needs.publish.outputs.pypi-publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.dist-artifact }}
          path: dist
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  report-pypi:
    # The coordinator's Release Health report went out with pypi "pending";
    # this fills in the outcome on the same row.
    needs:
      - publish
      - pypi
    if: >-
      !cancelled() && needs.publish.outputs.pypi-publish == 'true'
    uses: PyDevices/.github/.github/workflows/reusable-report-pypi-result.yml@publishing-v31
    with:
      distribution-name: omnipython-applibs
      version: ${{ needs.publish.outputs.version }}
      pypi-result: ${{ needs.pypi.result }}
    secrets: inherit

  allapps-page:
    # omnipython-builds' "All-apps browser page" workflow takes the
    # apps-release event, freezes every app at this tag into the browser
    # runtime, and publishes the page.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mint an installation token for omnipython-builds
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PYDEVICES_APP_ID }}
          private-key: ${{ secrets.PYDEVICES_APP_PRIVATE_KEY }}
          owner: PyDevices
          repositories: omnipython-builds

      - name: Ask omnipython-builds to build and publish the page
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APPS_REF: ${{ inputs.release-ref || github.event.release.tag_name }}
        run: |
          gh api --method POST repos/PyDevices/omnipython-builds/dispatches \
            -f event_type=apps-release \
            -f "client_payload[apps_ref]=$APPS_REF"
          echo "asked for the all-apps page at $APPS_REF"
