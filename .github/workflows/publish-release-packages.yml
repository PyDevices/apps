name: Publish release packages

# A published GitHub Release (made by tag-release.yml when VERSION changes on
# main) builds omnipython-applibs, uploads it to TestPyPI and asks the library
# index to publish lib/'s packages from the tag.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm inherited TestPyPI credentials
        env:
          TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [[ -z "$TESTPYPI_API_TOKEN" ]]; then
            echo "TESTPYPI_API_TOKEN is unavailable; ensure the organization secret is visible to PyDevices/apps." >&2
            exit 1
          fi

  publish:
    needs: credentials
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v17
    with:
      build-kind: pure-python
      distribution-name: omnipython-applibs
      # The one with no dependencies: controlkit needs lvgl and appkit needs pydevices.
      import-name: songmodel
      mip-profile: applibs
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit
